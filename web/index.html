<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>miaucam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { position: relative; margin: 0 auto; overflow: hidden; background: #111;
             width: min(100vw, 540px); height: min(100vh, 960px); }
    #meme, #meme-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #meme-video[hidden], #meme[hidden] { display: none; }
    #cam { position: absolute; top: max(24px, env(safe-area-inset-top)); right: 24px; width: 120px; height: 120px;
           border-radius: 50%; object-fit: cover; background: #222; }
    #cam.mirrored { transform: scaleX(-1); }
    #switch { position: absolute; bottom: max(32px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
              padding: 14px 28px; border: 0; border-radius: 999px; background: #6750a4; color: #fff; font-size: 16px; }
    #status { position: absolute; left: 12px; top: 12px; color: #fff; font-size: 12px; text-shadow: 0 0 4px #000; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="meme" alt="meme" hidden>
    <video id="meme-video" muted loop playsinline hidden></video>
    <video id="cam" muted playsinline></video>
    <div id="status">loading...</div>
    <button id="switch">Switch camera</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
