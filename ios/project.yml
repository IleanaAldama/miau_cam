name: Miaucam
options:
  bundleIdPrefix: com.miaucam
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_CXX_LIBRARY: libc++
    CODE_SIGN_STYLE: Automatic
targets:
  Miaucam:
    type: application
    platform: iOS
    sources:
      - path: Miaucam
      - path: ../src
        group: shared
        includes:
          - gesture.cpp
          - hand_classifier.cpp
          - face_signals.cpp
          - optical_flow.cpp
          - gesture_state.cpp
          - frame_pipeline.cpp
          - detection_input.cpp
      - path: ../models
        type: folder
        buildPhase: resources
      - path: ../memes
        type: folder
        buildPhase: resources
    dependencies:
      - framework: third_party/opencv2.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miaucam.app
        SWIFT_OBJC_BRIDGING_HEADER: Miaucam/Miaucam-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../src
          - $(SRCROOT)/../bridge
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Miaucam/Info.plist
      properties:
        CFBundleDisplayName: Miaucam
        NSCameraUsageDescription: Miaucam reads your camera to pick a meme. Frames stay on your device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
