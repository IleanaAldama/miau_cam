name: web
on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "models/**", "memes/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9

      - name: Cache OpenCV wasm libraries
        id: opencv
        uses: actions/cache@v4
        with:
          path: web/third_party/opencv-install
          key: opencv-wasm-4.9.0-em6.0.9-${{ hashFiles('web/scripts/build_opencv.sh') }}

      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: web/scripts/build_opencv.sh

      - name: Build wasm core
        run: web/scripts/build.sh

      - name: Assemble site
        run: |
          mkdir -p site/web
          cp web/index.html web/app.js site/web/
          cp -r web/dist site/web/dist
          cp -r models memes site/
          echo '<meta http-equiv="refresh" content="0; url=web/">' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
